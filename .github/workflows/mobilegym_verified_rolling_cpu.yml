name: MobileGym Verified Rolling CPU

on:
  push:
    branches:
      - "feature/mobilegym-verified-rolling-*"
  pull_request:
  workflow_dispatch:

jobs:
  rolling-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9"
      - name: Syntax check
        run: |
          python -m compileall -q src/improving/mobilegym_rolling.py src/improving/mobilegym_rolling_train.py src/improving/mobilegym_step_verify.py scripts/run_mobilegym_verified_rolling.py scripts/compare_mobilegym_evals.py tests/test_mobilegym_rolling.py tests/test_mobilegym_eval_compare.py
      - name: Verify train/test isolation and progress gates
        run: python -m pytest tests/test_mobilegym_rolling.py tests/test_mobilegym_eval_compare.py -q
